<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="clip.css">
        <title>Clip</title>
    </head>

<body>
    <h1 style="color:white">Snow Man</h1>
    <main>
        <div class="stack">`
            <div class="hat"> 
                <div class="strip"></div>
                <div class="hatpart"></div>
            </div>
            <div class="head">
                <div class="eyes">
                    <div class="left-eye"></div>
                    <div class="right-eye"></div>
                    
                </div>
                <div class="carrot"></div>
                <div class="mouth"></div>
            </div>
            

            <section class="bod">
            

                <div class="sticks">
                <div class="arm left-arm"></div>
                <div class="arm right-arm"></div>

                

                </div>

                <div class='rocks'>
                    <div class="rock1"></div>
                     <div class="rock2"></div>
                </div>

            </section>
            <div class="feet"></div>
        </div>
    </main>

    <section>
        <div class="snow-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    const container = document.querySelector(".snow-container");
    const totalFlakes = 100;

    for (let i = 0; i < totalFlakes; i++) {
      const flake = document.createElement("div");
      flake.classList.add("snowflake");

      
      const size = gsap.utils.random(5, 8);
      gsap.set(flake, {
        width: size,
        height: size,
        x: gsap.utils.random(0, window.innerWidth),
        y: gsap.utils.random(-100, -10),
        opacity: gsap.utils.random(0.4, 1)
      });

      container.appendChild(flake);

      
      gsap.to(flake, {
        y: window.innerHeight + 20,
        duration: gsap.utils.random(4, 9),
        delay: gsap.utils.random(0, 6),
        repeat: -1,
        ease: "none"
      });

      gsap.to(flake, {
        x: "+=" + gsap.utils.random(-40, 40),
        duration: gsap.utils.random(2, 4),
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut"
      });
    }

    gsap.to(".left-arm", {
        rotation: 1,
        transformOrigin: "right center",
        duration: 2,
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut"
      });

       gsap.to(".left-arm", {
        rotation: 1,
        transformOrigin: "right center",
        duration: 2,
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut"
      });

      gsap.to(".right-arm", {
        rotation: 1,
        transformOrigin: "left center",
        duration: 2,
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut"
      });


     
gsap.to(".left-eye, .right-eye", {
  x: 2,
  duration: 0.5,
  repeat: -1,
  yoyo: true,
  ease: "sine.inOut"
});


gsap.to(".left-eye, .right-eye", {
  scaleY: 0.1,
  transformOrigin: "center center",
  duration: 0.3,
  repeat: -1,
  yoyo: true,
  repeatDelay: 0.8,
  ease: "power1.inOut"
});

      
    </script>
  </script>
    </section>

    <div class="shadow"></div>


    </body>
</html>
